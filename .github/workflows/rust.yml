name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

# The repo pins nightly (rust-toolchain); the web build needs nightly + rust-src
# for `-Z build-std` (shared-memory wasm threads, see .cargo/config.toml).
#
# Native jobs run in a Fedora container because Ubuntu 24.04 (ubuntu-latest) has
# no SDL3 package, and building SDL3 from source (`--features efeengine-core/static`)
# currently fails: the sdl3-src crate ships without SDL's `test/` directory while
# SDL's CMake enables tests by default.

jobs:
  native:
    name: Native check + test
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install SDL3 and build tools
        run: dnf install -y --setopt=install_weak_deps=False SDL3-devel gcc gcc-c++ pkgconf-pkg-config git curl
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  wasm:
    name: Wasm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Check core + examples for the web
        run: |
          pkgs="-p efeengine-core"
          for d in examples/*/; do
            pkgs="$pkgs -p $(basename "$d")"
          done
          cargo check $pkgs --lib --target wasm32-unknown-unknown -Z build-std=panic_abort,std

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    container: fedora:latest
    # The code base has not been run through rustfmt/clippy yet. These report
    # problems without failing the build; drop `continue-on-error` once clean.
    continue-on-error: true
    steps:
      - name: Install SDL3 and build tools
        run: dnf install -y --setopt=install_weak_deps=False SDL3-devel gcc gcc-c++ pkgconf-pkg-config git curl
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets
