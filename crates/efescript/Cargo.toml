[package]
name = "efescript"
version = "0.2.0"
edition = "2021"



[dependencies]
efepages = { path = "../efepages" }
efevm = { path = "../efevm" }
proc_macros = { path="proc_macros" }
num-derive = "0.4.2"
num-traits = "0.2.19"
rodio = { version = "0.19", optional = true, default-features = false, features = ["symphonia-vorbis", "symphonia-wav", "symphonia-mp3", "symphonia-flac"] }

[features]
default = []
# real sound playback for the PlaySound syscall (needs ALSA headers on Linux)
audio = ["dep:rodio"]
