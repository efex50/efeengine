[package]
name = "efescript"
version = "0.2.0"
default-run = "efescript"
edition = "2021"



[[bin]]
name = "efescript"
path = "src/main.rs"

[[bin]]
name = "efescript-runner"
path = "src/bin/runner.rs"

[dependencies]
efevm = { path = "../efevm" }
lsp-server = "0.7"
lsp-types = "0.97"
rodio = { version = "0.19", optional = true, default-features = false, features = ["vorbis", "symphonia-wav", "symphonia-mp3", "symphonia-flac"] }
serde_json = "1.0.154"

[features]
default = []
# real sound playback for std.play_sound (needs ALSA headers on Linux)
audio = ["dep:rodio"]
