[package]
name = "hecs-macros"
version = "0.11.1"
description = "Procedural macro definitions for hecs"
authors = ["Benjamin Saunders <ben.e.saunders@gmail.com>"]
edition = "2021"
license = "Apache-2.0"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0.10", default-features = false, features = ["proc-macro", "parsing", "printing", "derive", "clone-impls", "visit-mut"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"

[dev-dependencies]
# Remarkably, this isn't a circular dependency. Test crates coexist
# with regular crates, even in unit tests!
hecs = { package = "efecs", features = ["macros"], path = ".." }
