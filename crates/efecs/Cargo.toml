[package]
name = "efecs"
version = "0.11.2"
description = "efeengine's fork of hecs 0.11.2 (https://github.com/Ralith/hecs)"
authors = ["Benjamin Saunders <ben.e.saunders@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/efex50/efeengine"
publish = false
readme = "README.md"
keywords = ["ecs", "entity"]
categories = ["data-structures", "game-engines", "no-std"]
rust-version = "1.81"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

# Keep the library name `hecs` so upstream code, docs and tests work unchanged.
[lib]
name = "hecs"

[features]
default = ["std"]
std = []
# Enables derive(Bundle) and derive(Query)
macros = ["hecs-macros"]
# Enables the serialize::column module
column-serialize = ["serde"]
# Enables the serialize::row module
row-serialize = ["serde"]

[dependencies]
hecs-macros = { path = "macros", version = "0.11.1", optional = true }
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher", "inline-more"] }
serde = { version = "1.0.229", default-features = false, optional = true }
spin = { version = "0.12.3", default-features = false, features = ["mutex", "spin_mutex", "lazylock"] }
foldhash = { version = "0.2.0", default-features = false }

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.4"
trybuild = "1.0.125"
serde = { version = "1.0.229", features = ["derive"] }
serde_test = "1.0.177"
bincode = "1.3.3"

[[bench]]
name = "bench"
harness = false
required-features = ["macros"]


[[example]]
name = "serialize_to_disk"
required-features = ["column-serialize"]
