[package]
name = "efeengine-core"
version = "0.1.0"
edition = "2024"
license = "MIT"



[lib]
crate-type = ["cdylib", "rlib"]




[package.metadata.vcpkg]
vcpkg-root = "C:/Users/efe/scoop/apps/vcpkg/current" # Scoop kullanıyorsan yolun doğruluğuna bak
install = ["sdl3"]
[package.metadata.vcpkg.target.x86_64-pc-windows-msvc]
install = ["sdl3:x86_64-windows"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
log = "0.4.35"
once_cell = "1.21.4"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
wgpu = "30.0.2"
efeengine-macros = { path = "./macros" }
# `spin`: flume's internal channel lock is a spin lock. The std Mutex waits with Atomics.wait on wasm,
# which throws on the browser main thread when a worker holds the lock during `send`.
flume = { version = "0.12.0", default-features = false, features = ["spin"] }
oneshot = { version = "0.2.1", features = ["std"] }
# ECS for the game world (ROADMAP Phase 3)
# hecs, forked into crates/efecs (see crates/efecs/FORK.md); still imported as `hecs`
hecs = { package = "efecs", path = "../efecs" }
thiserror = "2.0.21"
# math for components (Transform, Velocity); bytemuck so components can be Pod
glam = { version = "0.34.3", features = ["bytemuck"] }
# script-visible layouts (StructDesc, Prim) and fnv1a32 component ids
efevm = { path = "../efevm" }
# mod packages (.efmod): reader only, no `write` feature (no compressor on the engine path)
efemod = { path = "../efemod" }
# the .efa compiler (feature `efa`)
efa = { path = "../efa", optional = true }
# PNG decoding (render/png.rs): zlib inflate and chunk CRCs, pure Rust, also on wasm
miniz_oxide = "0.9.1"
crc32fast = "1.5.5"
# cache keys and verification (pure Rust, also on wasm)
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "1.0.145"
# tests build packages
efemod = { path = "../efemod", features = ["write"] }


[features]
default = ["efa"]
efa = ["dep:efa"]
debug_log = []
static=["sdl3/build-from-source","sdl3/static-link"]

[target.'cfg(target_os = "windows")'.build-dependencies]
vcpkg = "0.2.15"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.2"
sdl3-sys = "0.7.3"
sdl3 = { version = "0.22.1", features = ["raw-window-handle"] }
env_logger = "0.11.11"


[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL2 fallback for browsers without WebGPU (webgpu is already a default feature)
wgpu = { version = "30.0.2", features = ["webgl"] }
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.107"
ts-rs = "12.0.1"
gloo-timers = "0.4.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.107"
features = [
    "Worker",
    "WorkerOptions",
    "DedicatedWorkerGlobalScope",
    "WorkerType",
    "MessageEvent",
    "Window",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Location",
    # web window backend (window/web_backend.rs)
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "Navigator",
    "HtmlElement",
    "Performance",
    # input (pointer, wheel, DPR, text)
    "PointerEvent",
    "MouseEvent",
    "WheelEvent",
    "DomRect",
    "DomRectReadOnly",
    "AddEventListenerOptions",
    "MediaQueryList",
    "CompositionEvent",
    "CssStyleDeclaration",
    # gamepad polling (window/web_backend.rs)
    "Gamepad",
    "GamepadButton",
    "GamepadMappingType",
    # focus without scrolling, canvas connectivity
    "FocusOptions",
    "Node",
]
