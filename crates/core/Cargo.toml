[package]
name = "efeengine-core"
version = "0.1.0"
edition = "2024"



[lib]
crate-type = ["cdylib", "rlib"]




[package.metadata.vcpkg]
vcpkg-root = "C:/Users/efe/scoop/apps/vcpkg/current" # Scoop kullanıyorsan yolun doğruluğuna bak
install = ["sdl3"]
[package.metadata.vcpkg.target.x86_64-pc-windows-msvc]
install = ["sdl3:x86_64-windows"]

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
log = "0.4.28"
once_cell = "1.21.3"
raw-window-handle = "0.6.2"
serde = { version = "1.0.228", features = ["derive"] }
wgpu = "27.0.1"
efeengine-macros = { path = "./macros" }
flume = { version = "0.12.0", default-features = false }
oneshot = "0.1.11"
# ECS for the game world (ROADMAP Phase 3)
hecs = "0.11.0"
thiserror = "2"

[dev-dependencies]
serde_json = "1.0.145"


[features]
default = []
debug_log = []
static=["sdl3/build-from-source","sdl3/static-link"]

[target.'cfg(target_os = "windows")'.build-dependencies]
vcpkg = "0.2.15"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4.0"
sdl3-sys = "0.5.12"
sdl3 = { version = "0.14", features = ["raw-window-handle"] }
env_logger = "0.11"


[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL2 fallback for browsers without WebGPU (webgpu is already a default feature)
wgpu = { version = "27.0.1", features = ["webgl"] }
console_error_panic_hook = "0.1.7"
console_log = "1"
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3"
ts-rs = "11.1.0"
gloo-timers = "0.3.0"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.83"
features = [
    "Worker",
    "WorkerOptions",
    "DedicatedWorkerGlobalScope",
    "WorkerType",
    "MessageEvent",
    "Window",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Location",
    # web window backend (window/web_backend.rs)
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "Navigator",
    "HtmlElement",
    "Performance",
    # input (pointer, wheel, DPR, text)
    "PointerEvent",
    "MouseEvent",
    "WheelEvent",
    "DomRect",
    "DomRectReadOnly",
    "AddEventListenerOptions",
    "MediaQueryList",
    "CompositionEvent",
    "CssStyleDeclaration",
    # gamepad polling (window/web_backend.rs)
    "Gamepad",
    "GamepadButton",
    "GamepadMappingType",
    # focus without scrolling, canvas connectivity
    "FocusOptions",
    "Node",
]
