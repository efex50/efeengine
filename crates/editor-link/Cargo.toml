[package]
name = "efeengine-editor-link"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Localhost editor link for efeengine games: versioned handshake and a read-only inspection protocol. Off unless EFE_EDITOR=1."

[dependencies]
efeengine-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"

# Local socket (Unix domain socket, Windows named pipe). 2.4.7 was published 2026-10-23.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
interprocess = "=2.4.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
