[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/core/macros",
    "crates/ui",
    "crates/ui-core",
    "crates/world-ui",
    "crates/editor-link",
    "crates/editor",
    "crates/project",
    "crates/efescript",
    "crates/efescript/proc_macros",
    "crates/efescript/strtohx",
    "crates/efepages",
    "crates/efepages/page_size_macro",
    "crates/calc",
    "crates/efevm",
    "crates/efevm-jit",
    "crates/efa",
    "crates/efemod",
    "crates/efe-guest",
    "crates/efe-wasm",
    "crates/efecs",
    "crates/efecs/macros",
    "examples/*",
    "xtask",
]
exclude = ["crates/efa/fuzz", "crates/efecs/tests/no-std-test-crates", "examples/script_demo/wasm_mods/rust_mod", "examples/coin_dash_wasm/mods/dash_rust"]

[profile.optimize]
inherits = "release"
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
