[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/core/macros",
    "crates/efescript",
    "crates/efescript/proc_macros",
    "crates/efescript/strtohx",
    "crates/efepages",
    "crates/efepages/page_size_macro",
    "crates/calc",
    "crates/efevm",
    "crates/efa",
    "crates/efemod",
    "examples/*",
    "xtask",
]
exclude = ["crates/efa/fuzz"]

[profile.optimize]
inherits = "release"
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
