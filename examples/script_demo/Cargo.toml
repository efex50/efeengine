[package]
name = "script_demo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "script_demo"
path = "src/main.rs"


[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
rev = "4c1db68"
dependencies = ["sdl3"]


[dependencies]
efeengine-core = { path = "../../crates/core" }
efeengine-editor-link = { path = "../../crates/editor-link" }

[features]
# Run the scripts on the Cranelift JIT (native only): `cargo run -p script_demo --features jit`
jit = ["efeengine-core/jit"]
