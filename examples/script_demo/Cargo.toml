[package]
name = "script_demo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "native"
path = "src/lib.rs"


[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
rev = "4c1db68"
dependencies = ["sdl3"]


[dependencies]
efeengine-core = { path = "../../crates/core" }

[dev-dependencies]
# Only the end-to-end test assembles .efa sources; the engine and the game never depend on it.
efescript = { path = "../../crates/efescript" }
