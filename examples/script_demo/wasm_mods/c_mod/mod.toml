[mod]
id = "wasm_c"
version = "1.0.0"
name = "Wasm C"
description = "script_demo mod written in C: calls game.score_add/report and inventory.give, reads inventory.given, provides sum_squares, checksum and boom."
game = "script_demo"

# inventory's namespace needs no grant (it is a dependency). engine.events is for the event
# calls of the translated module; game.* for score_add and report.
[dependencies]
inventory = "^1"

[permissions]
namespaces = ["engine.events", "game"]

# The wasm to translate (design doc section 8; `efescript pack` of wasm is E7.4c).
[build]
wasm = "mod.wasm"
# The size of the scratch region (EFE_SCRATCH in mod.c): the translator's Fallback::scratch.
scratch = 256

# C cannot emit the efe.provide section for wasm (design doc 4.3), so the provides are given here
# (4.4): the translator's Fallback. The same list as ../rust_mod/mod.toml.
[[provide]]
name = "sum_squares"
export = "efe_provide_sum_squares"
doc = "Sum of the squares 1..=n, collected in a static array; -1 unless n is in 0..=256."
params = ["n: i32"]
results = ["result: i64"]

[[provide]]
name = "checksum"
export = "efe_provide_checksum"
doc = "Weighted byte sum of `name`: the sum of (index + 1) * byte, over a copy of the text in a static buffer."
params = ["name: str"]
results = ["result: i64"]

[[provide]]
name = "boom"
export = "efe_provide_boom"
doc = "Traps when `code` is 13, else returns `code * 2`."
params = ["code: i32"]
results = ["result: i32"]
