[mod]
id = "inventory"
version = "1.0.0"
name = "Inventory"
description = "Gives items; announces each gift with the inventory.given event."
game = "script_demo"

# engine.log is the import in src/items.efa (not the root file): a grant covers the whole
# package. engine.events is for the send of the mod's own event.
[permissions]
namespaces = ["engine.log", "engine.events"]

# Free-form metadata: the game logs it after the load (Manifest.meta).
[meta]
category = "items"
max_stack = 99

[meta.ui]
icon = "bag"
