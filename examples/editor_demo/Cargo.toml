[package]
name = "editor_demo"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "editor_demo"
path = "src/main.rs"

[dependencies]
efeengine-core = { path = "../../crates/core" }
efeengine-ui = { path = "../../crates/ui", default-features = false, features = ["editor"] }

[features]
default = ["iced", "fallback"]
iced = ["efeengine-ui/iced"]
fallback = ["efeengine-ui/fallback"]
