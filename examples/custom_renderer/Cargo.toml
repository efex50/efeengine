[package]
name = "custom_renderer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "custom_renderer"
path = "src/main.rs"


[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
rev = "4c1db68"
dependencies = ["sdl3"]


[dependencies]
efeengine-core = { path = "../../crates/core" }
bytemuck = { version = "1.24.0", features = ["derive"] }
