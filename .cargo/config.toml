[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "target-feature=+atomics",
    "-C", "target-feature=+bulk-memory",
    "-C", "link-arg=--shared-memory",
    "-C", "link-arg=--max-memory=2147483648", # 2GB fweb için hafıza
    "-C", "link-arg=--import-memory",
    "-C", "link-arg=--export=__wasm_init_tls",
    "-C", "link-arg=--export=__tls_size",
    "-C", "link-arg=--export=__tls_align",
    "-C", "link-arg=--export=__tls_base",
    "-C", "link-arg=--export=__heap_base", # wasm-bindgen threads transform needs it
    "-C", "link-arg=--export=__data_end",
]
[alias]
# Build/run automation (Rust port of build.py): cargo xtask --help
xtask = "run --quiet --package xtask --"
